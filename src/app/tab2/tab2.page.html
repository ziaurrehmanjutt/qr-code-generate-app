<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      QR Generator
    </ion-title>

    <ion-buttons slot="end">
      <!-- <ion-button (click)="resetToDefaults()" title="Reset to defaults">
        <ion-icon slot="icon-only" name="refresh-outline"></ion-icon>
      </ion-button> -->
      <ion-button (click)="isDownlaodSheetOpen = true" title="Download QR Code">
        <ion-icon slot="icon-only" name="download-outline"></ion-icon>
      </ion-button>
      <!-- <ion-button (click)="togglePanel()" [color]="panelOpen ? 'primary' : ''">
        <ion-icon slot="icon-only" name="options-outline"></ion-icon>
      </ion-button> -->
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">QR Generator</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-segment>
    <ion-segment-button value="text">
      <ion-label>Text</ion-label>
    </ion-segment-button>
    <ion-segment-button value="url">
      <ion-label>URL</ion-label>
    </ion-segment-button>
    <ion-segment-button value="email">
      <ion-label>Email</ion-label>
    </ion-segment-button>
    <ion-segment-button value="mobile">
      <ion-label>Mobile</ion-label>
    </ion-segment-button>
  </ion-segment>
  <div class="ion-padding ">
    <ion-textarea class="qr-text" placeholder="Enter text to generate QR code" [(ngModel)]="qrData"></ion-textarea>
  </div>

  <div>
    <div class="qr-container" #canvas></div>
  </div>



   <ion-modal 
    (onWillDismiss)="isDownlaodSheetOpen = false"
    [isOpen]="isDownlaodSheetOpen" 
    [initialBreakpoint]="0.25" 
    [breakpoints]="[0, 0.25, 0.5, 0.75]">
    <ng-template>
      <ion-content>
        <ion-radio-group [(ngModel)]="downloadFormat">
          <ion-list-header>
            <ion-label>Download Format</ion-label>
          </ion-list-header>

          <ion-item>
            <ion-label>PNG</ion-label>
            <ion-radio slot="start" value="png"></ion-radio>
          </ion-item>

          <ion-item>
            <ion-label>JPEG</ion-label>
            <ion-radio slot="start" value="jpeg"></ion-radio>
          </ion-item>

          <ion-item>
            <ion-label>SVG</ion-label>
            <ion-radio slot="start" value="svg"></ion-radio>
          </ion-item>
        </ion-radio-group>
        <ion-button expand="block" (click)="download()">Download</ion-button>
        <ion-button expand="block" (click)="open()">Open</ion-button>
      </ion-content>
    </ng-template>
  </ion-modal>

</ion-content>
